<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoApp - Panel de Administración</title>
    <!-- Hoja de estilos unificada -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Barra de Navegación Global Compartida -->
    <header class="global-header">
        <div class="global-nav-container">
            <a href="index.html" class="brand-link">
                <span>🍽️ RestoApp</span>
                <span class="brand-badge">Admin</span>
            </a>

            <nav aria-label="Navegación principal">
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-menu-link">🏠 Inicio</a></li>
                    <li><a href="pedido.html" class="nav-menu-link">📋 Pedidos</a></li>
                    <li><a href="login.html" class="nav-menu-link">🔐 Acceso</a></li>
                    <li><a href="admin.html" class="nav-menu-link active">⚙️ Admin</a></li>
                    <li><a href="tests/test-runner.html" class="nav-menu-link">🧪 Pruebas</a></li>
                </ul>
            </nav>

            <div class="nav-actions">
                <span id="navUserBadge"></span>
                <button id="themeToggleBtn" class="theme-toggle-btn">🌙 Modo Oscuro</button>
            </div>
        </div>
    </header>

    <main class="app-container">
        <header class="app-header">
            <h1>⚙️ Panel de Administración</h1>
            <p>Gestiona el catálogo de platos conectado a Firebase Realtime Database.</p>
        </header>

        <!-- Mensaje de estado -->
        <div id="prodAlert" class="alert" role="alert"></div>

        <!-- Formulario para crear platos -->
        <section class="card">
            <h2 class="card-title">Crear Nuevo Plato</h2>
            
            <form id="formCreateProduct" class="form-layout" novalidate>
                <div class="form-group">
                    <label for="inputProdName" class="form-label">Nombre del Plato:</label>
                    <input 
                        type="text" 
                        id="inputProdName" 
                        class="form-control" 
                        placeholder="Ej: Pasta Carbonara" 
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="inputProdPrice" class="form-label">Precio ($):</label>
                    <input 
                        type="number" 
                        id="inputProdPrice" 
                        class="form-control" 
                        min="1" 
                        max="50000000"
                        step="any" 
                        placeholder="Ej: 25000" 
                        required
                    >
                </div>

                <button type="submit" id="btnCrearProducto" class="btn btn-primary">
                    Guardar Plato en Firebase
                </button>
            </form>
        </section>

        <!-- Vista previa de platos en el catálogo -->
        <section class="card">
            <h2 class="card-title">Platos Registrados en el Menú</h2>
            <div id="menuItemsList" class="items-list">
                <!-- Se llena dinámicamente desde Firebase -->
            </div>
        </section>

        <!-- Botón para cerrar sesión -->
        <button id="btnLogout" class="btn btn-danger">
            Cerrar Sesión
        </button>
    </main>

    <!-- Scripts Modulares -->
    <script type="module" src="js/navbar.js"></script>
    <script type="module" src="js/pages/adminPage.js"></script>
</body>
</html>

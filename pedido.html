<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoApp - Toma de Pedidos</title>
    <!-- Hoja de estilos unificada -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

        <!-- Barra de Navegación Global Compartida -->
    <header class="global-header">
        <div class="global-nav-container">
            <a href="index.html" class="brand-link">
                <span>🍽️ RestaudoApp</span>
                <span class="brand-badge">Mesero</span>
            </a>

            <nav aria-label="Navegación principal">
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-menu-link active">🏠 Inicio</a></li>
                    <li><a href="pedido.html" class="nav-menu-link">📋 Pedidos</a></li>
                    <li><a href="login.html" class="nav-menu-link">🔐 Acceso</a></li>
                    <li><a href="admin.html" class="nav-menu-link">⚙️ Admin</a></li>
                    <li><a href="orders.html" class="nav-menu-link">🧾 Órdenes</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <main class="app-container">
        <header class="app-header">
            <h1>📋 Toma de Pedidos</h1>
            <p>Selecciona el plato y la cantidad para calcular subtotal e impuestos (IVA 19%).</p>
        </header>

        <!-- Mensaje de error accesible (role="alert") -->
        <div id="alertError" class="alert alert-danger" role="alert"></div>

        <!-- Formulario de toma de pedidos -->
        <section class="card">
            <h2 class="card-title">Detalle del Pedido</h2>
            
            <form id="formPedido" class="form-layout" novalidate>
                <div class="form-group">
                    <label for="selectPlato" class="form-label">Plato del Menú:</label>
                    <select id="selectPlato" class="form-control" required>
                        <option value="">-- Cargando menú... --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="inputCantidad" class="form-label">Cantidad:</label>
                    <input 
                        type="number" 
                        id="inputCantidad" 
                        class="form-control" 
                        min="1" 
                        max="500"
                        placeholder="Ej: 2" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="inputPrecio" class="form-label">Precio Unitario ($):</label>
                    <input 
                        type="number" 
                        id="inputPrecio" 
                        class="form-control" 
                        placeholder="Selecciona un plato para ver el precio" 
                        readonly
                    >
                </div>

                <button type="submit" id="btnProcesarPedido" class="btn btn-primary">
                    Procesar Pedido
                </button>
            </form>
        </section>

        <!-- Resultado / Resumen del pedido con aria-live para accesibilidad -->
        <div id="orderResult" class="alert alert-info" aria-live="polite"></div>
    </main>

    <!-- Scripts Modulares -->
    <script type="module" src="js/navbar.js"></script>
    <script type="module" src="js/pages/pedidoPage.js"></script>
</body>
</html>
